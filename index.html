<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom File Encrypter</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5f9;
            margin: 0;
            padding: 40px 15px;
        }

        .container {
            max-width: 480px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #243b55;
        }

        p {
            color: #555;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input, select, button {
            width: 100%;
            box-sizing: border-box;
            padding: 11px;
            font-size: 15px;
        }

        button {
            margin-top: 22px;
            background: #2457a7;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #193f7c;
        }

        .note {
            font-size: 13px;
            color: #666;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Custom File Encrypter</h1>
        <p>Encrypt a file with a password or decrypt a file you encrypted earlier.</p>

        <form action="process" method="post" enctype="multipart/form-data">

            <label for="file">Choose a file</label>
            <input type="file" id="file" name="file" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   required autocomplete="off">

            <label for="operation">Operation</label>
            <select id="operation" name="operation" required>
                <option value="encrypt">Encrypt</option>
                <option value="decrypt">Decrypt</option>
            </select>

            <button type="submit">Process File</button>

            <p class="note">
                Keep your password safe. You need the same password to decrypt
                an encrypted file.
            </p>
        </form>
    </div>
</body>
</html>
